[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tree_bstats"
version = "1.0.0"
description = "Clade-number and daughter-number basis representations of tree balance indices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[project.urls]
Repository = "https://github.com/dbauman18/phylogenetic_basis_statistics"

[tool.setuptools.packages.find]
where = ["src"]
